const industries=[
{name:'Automotive',icon:'car',desc:'Materials that help vehicles handle heat, power and movement.',apps:[['Exhaust and hot parts','Heat and oxidation resistance are important in demanding engine environments.','Sheet / plate','Strip','Wire'],['Electrical parts','Selected copper and nickel products can support conductive or precision components.','Strip','Wire']],watch:'Electrification changes the mix of components. Connect vehicle production to demand for each specific part.'},
{name:'Oil and gas',icon:'oil',desc:'Materials for harsh conditions, from wells to processing plants.',apps:[['Corrosive environments','Nickel alloys and specialty stainless steels are used where corrosion limits ordinary materials.','Sheet / plate','Bar','Wire'],['Welded equipment','Welding consumables help join materials used in demanding operating conditions.','Welding consumables']],watch:'Track new projects, maintenance and corrosion requirements separately.'},
{name:'Energy and environment',icon:'energy',desc:'Materials for power, hydrogen and cleaner industrial processes.',apps:[['Power and hydrogen equipment','Requirements depend on temperature, pressure and the particular technology.','Sheet / plate','Strip','Bar'],['Pollution control','Corrosion-resistant materials can be relevant in chemical and exhaust treatment equipment.','Sheet / plate','Welding consumables']],watch:'Project announcements are not completed installations. Separate plans from funded demand.'},
{name:'Aerospace',icon:'plane',desc:'Materials that perform reliably under extreme heat and stress.',apps:[['Hot engine components','Nickel and cobalt alloys can provide high-temperature performance; exact grades require validation.','Sheet / plate','Bar','Wire'],['Specialized manufacturing','Powders and welding products may serve qualified production and repair processes.','Metal powders','Welding consumables']],watch:'Production ramp-up, repair demand and supplier qualification shape the accessible market.'},
{name:'Chemical processing',icon:'chemical',desc:'Materials that withstand heat and aggressive chemicals.',apps:[['Reactors and heat exchangers','Nickel alloys, zirconium and specialty stainless steels can address different corrosion conditions.','Sheet / plate','Bar'],['Plant construction and repair','Material choice depends on the chemicals, temperature and joining process.','Wire','Welding consumables']],watch:'Follow plant investment and replacement cycles, then identify the equipment and alloy required.'},
{name:'Electronics and electrical',icon:'chip',desc:'Precision metals behind chips, components and electrical systems.',apps:[['Precision components','Selected strip and wire products may suit electrical or tightly controlled component designs.','Strip','Wire'],['Semiconductor equipment','High-purity and corrosion-resistant materials can be relevant to specific production equipment.','Sheet / plate','Bar']],watch:'Distinguish chip demand from spending on the equipment used to manufacture chips.'},
{name:'Medical technology',icon:'medical',desc:'Materials for reliable medical devices and instruments.',apps:[['Medical components','Selected cobalt alloys and specialty stainless steels may suit specific medical applications.','Bar','Wire','Sheet / plate'],['Specialized production','Metal powders can support selected additive manufacturing processes.','Metal powders']],watch:'Medical use requires application-specific grades, certification and qualification.'}];

const regions=['World','Europe','North America','Asia-Pacific','Other regions'];let state={tab:'global',region:'World',sector:null,product:null,period:'Today'};const nav=document.querySelector('nav');function setTab(t){state.tab=t;state.sector=null;state.product=null;render();window.scrollTo(0,0)}function header(k,t,p){return `<div class="top"><span>METALS ATLAS <span style="margin:0 9px;color:#c9d1dd">/</span> ${k}</span></div><div class="intro"><div class="eyebrow">Explore the market</div><h1>${t}</h1><p>${p}</p></div>`}function card(i){return `<button class="card" onclick="openIndustry(${i})"><span class="icon">${icon(industries[i].icon)}</span><h3>${industries[i].name}</h3><p>${industries[i].desc}</p><div class="cardbottom"><span>Applications · products · opportunities</span><span class="arrow">↗</span></div></button>`}function openIndustry(i){state.tab='industries';state.sector=i;render();window.scrollTo(0,0)}function openProduct(i){state.tab='products';state.product=i;render();window.scrollTo(0,0)}

function frameworkGlobalView(){let hist=state.period==='History';return header('Global','The big picture.','Start with the world. Then explore an industry or a product.')+`<div class="mode"><button class="${hist?'sel':''}" onclick="state.period='History';render()">Historical market</button><button class="${!hist?'sel':''}" onclick="state.period='Today';render()">Current market</button></div><div class="global"><section class="box"><h2>Where are you looking?</h2><div class="regionbar">${regions.map(r=>`<button class="chip ${state.region===r?'selected':''}" onclick="state.region='${r}';render()">${r}</button>`).join('')}</div>${worldMap()}</section><section class="box"><div class="eyebrow">${state.region} · ${hist?'History':'Today'}</div><h3>${hist?'How did the market change?':'What does the market look like?'}</h3><p style="font-size:13px">${hist?'Compare demand, production and prices over time.':'Connect production and trade to the industries buying these products.'}</p><div class="rows">${(hist?['Demand over time','Production over time','Price changes']:['Market size','Production and trade','Main producers']).map(x=>`<div class="row"><b>${x}</b><span>To research</span></div>`).join('')}</div><div class="note">No verified regional figures added yet.</div></section></div><div class="stats"><div class="stat"><strong>7</strong><small>Industries to explore</small></div><div class="stat"><strong>6</strong><small>Product groups</small></div><div class="stat"><strong>2035</strong><small>Strategy horizon</small></div></div><div class="sectionrow"><h2>Follow the demand</h2><button class="link" onclick="setTab('industries')">View all industries →</button></div><div class="grid">${[0,3,4].map(card).join('')}</div>`}
function frameworkIndustryView(){if(state.sector===null)return header('Industries','One industry at a time.','See the market first. Then find the applications and products that matter.')+`<div class="sectionrow"><h2>Choose an industry</h2><input class="search" aria-label="Find an industry" placeholder="Find an industry…" oninput="filterCards(this.value)"></div><div class="grid" id="industrycards">${industries.map((s,i)=>card(i)).join('')}</div>`;const s=industries[state.sector];return header('Industries / '+s.name,s.name,s.desc)+`<button class="back" onclick="setTab('industries')">← All industries</button><div class="detailgrid"><section class="box"><div class="eyebrow">01 · Market overview</div><h3>Understand the industry</h3><div class="rows">${['Past and current demand','Main regions','Customers and competitors'].map(t=>`<div class="row"><b>${t}</b><span>Research pending</span></div>`).join('')}</div><h3 style="margin-top:25px">What to watch</h3><p style="font-size:14px">${s.watch}</p><div class="note">Research question, not a forecast or recommendation.</div></section><section class="box"><div class="eyebrow">02 · Company opportunities</div><h3>Where could the products fit?</h3>${s.apps.map(a=>`<div class="application"><b>${a[0]}</b><p>${a[1]}</p>${a.slice(2).map(n=>`<button class="chip" style="margin:9px 4px 0 0" onclick="openProduct(${products.findIndex(p=>p[0]===n)})">${n} ↗</button>`).join('')}</div>`).join('')}</section></div><section class="box" style="margin-top:20px"><h2>What would make this a good opportunity?</h2><div class="steps"><span class="step">Growing demand</span><span>+</span><span class="step">Right product</span><span>+</span><span class="step">Reachable customer</span><span>+</span><span class="step">Ability to compete</span></div><p class="note">Validate alloy grades, product availability, customer requirements and economics before ranking opportunities.</p></section>`}
function filterCards(q){document.querySelector('#industrycards').innerHTML=industries.map((s,i)=>({s,i})).filter(x=>(x.s.name+' '+x.s.desc).toLowerCase().includes(q.toLowerCase())).map(x=>card(x.i)).join('')||'<p>No industries found. Try a shorter word.</p>'}
function productView(){if(state.product===null)return header('Products','Start with the product.','Choose a shape. See what it does and where it could be used.')+`<div class="grid">${products.map((p,i)=>`<button class="card" onclick="openProduct(${i})"><span class="icon">${icon('products')}</span><h3>${p[0]}</h3><p>${p[1]}</p><div class="cardbottom"><span>Explore uses</span><span class="arrow">↗</span></div></button>`).join('')}</div><p class="note">Product groups from the project brief. Exact sizes, alloy grades and company capabilities remain to be validated.</p>`;const p=products[state.product],matches=industries.map((s,i)=>({s,i})).filter(x=>x.s.apps.some(a=>a.slice(2).includes(p[0])));return header('Products / '+p[0],p[0],p[1])+`<button class="back" onclick="setTab('products')">← All products</button><div class="box"><h2>From material to customer</h2><div class="steps"><span class="step">Choose an alloy</span><span>→</span><span class="step">${p[0]}</span><span>→</span><span class="step">Make a component</span><span>→</span><span class="step">Serve an industry</span></div><p class="note">Materials in scope: nickel alloys, specialty stainless steels, cobalt alloys, zirconium, aluminium and copper. Suitability depends on the application.</p></div><div class="sectionrow"><h2>Explore possible uses</h2><span class="pill">Illustrative application links</span></div><div class="grid">${matches.map(x=>card(x.i)).join('')}</div>`}

function sourceLink(key){const s=demoSources[key];return `<a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.name} ↗</a>`;}
function metricTable(rows,showIndustry=false){return rows.length?`<div class="tablewrap"><table class="datatable"><caption>${showIndustry?'Selected market indicators':'Three essential indicators'}</caption><thead><tr>${showIndustry?'<th scope="col">Industry</th>':''}<th scope="col">Indicator</th><th scope="col">Value</th><th scope="col">Year</th><th scope="col">Source</th></tr></thead><tbody>${rows.map(r=>`<tr>${showIndustry?`<td><button class="link" onclick="openIndustry(${r.sector})">${industries[r.sector].name} ↗</button></td>`:''}<td>${r.metric}<small>${r.meaning}</small></td><td class="metricvalue">${r.value}</td><td>${r.year}</td><td>${sourceLink(r.source)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No selected demo data for this region and period. Choose World to see the complete sample.</p>';}

 const rows=demoMetrics.filter(r=>r.period===state.period&&(state.region==='World'||r.region===state.region));

 html=html.replace(placeholder,`<div class="rows"><div class="row"><b>${rows.length}</b><span>Sourced indicators in this selection</span></div><div class="row"><b>3 industries</b><span>Energy · Chemicals · Electrical</span></div></div><p class="note">Current = latest annual observations selected for this demo. Years and geographic coverage appear in the table.</p>`);
 // Keep navigation familiar; make the three populated industries the demo entry points.
 html=html.replace([0,3,4].map(card).join(''),[2,4,5].map(card).join(''));
 const table=`<section class="box" style="margin-top:22px"><div class="sectionrow" style="margin-top:0"><h2>${state.region} · ${state.period==='History'?'Historical comparison':'Current market indicators'}</h2><span class="pill">${rows.length} observations</span></div>${metricTable(rows,true)}<p class="note">Public end-market data selected on 28 October 2026. Mt = million tonnes; GW = gigawatts; bn = billion. These indicators are not an estimate of the specialty-metals market. Global observations are not assigned to individual regions.</p></section>`;
 return html.replace('<div class="stats">',table+'<div class="stats">');
}
function industryView(){
 let html=frameworkIndustryView();if(state.sector===null)return html;
 const sector=state.sector;if(!applicationSources[sector])return html;
 const placeholder='<div class="rows">'+['Past and current demand','Main regions','Customers and competitors'].map(t=>`<div class="row"><b>${t}</b><span>Research pending</span></div>`).join('')+'</div>';
 html=html.replace(placeholder,metricTable(demoMetrics.filter(r=>r.sector===sector&&r.period==='Today'))).replace('Research question, not a forecast or recommendation.','End-market indicators; not a specialty-alloy demand forecast.');
 html=html.replace('<h3>Where could the products fit?</h3>',`<h3>Where could the products fit?</h3><p style="font-size:13px">${demoTakeaway[sector]}</p>`);
 return html.replace('</section></div><section',`<p class="note"><a href="${applicationSources[sector]}" target="_blank" rel="noopener noreferrer">VDM application reference ↗</a><br>Portfolio benchmark; client capabilities and customer approvals require validation.</p></section></div><section`);
}

function render(){nav.innerHTML=['global','industries','products'].map(t=>`<button class="${state.tab===t?'active':''}" onclick="setTab('${t}')" ${state.tab===t?'aria-current="page"':''}>${icon(t)}${t[0].toUpperCase()+t.slice(1)}<span style="margin-left:auto">›</span></button>`).join('');document.querySelector('#main').innerHTML=state.tab==='global'?globalView():state.tab==='industries'?industryView():productView();}render();
</script></body></html>
