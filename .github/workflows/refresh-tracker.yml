name: Refresh tracker data

on:
  schedule:
    - cron: "41 5 * * 1"   # Mondays, 05:41 UTC
  workflow_dispatch: {}      # "Run workflow" button after the team edits the tracker

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Read the Sector Research Tracker
        run: python pipeline/tracker.py
      - name: Open a pull request for review
        uses: peter-evans/create-pull-request@v6
        with:
          branch: tracker-refresh
          delete-branch: true
          add-paths: tracker-data.js
          commit-message: "Refresh tracker data"
          title: "Tracker data refresh"
          body: "Generated by pipeline/tracker.py from the Sector Research Tracker (shared as view-only link)."
